<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}NeuralShield{% endblock %}</title>
<style>
  :root {
    --bg: #000000;
    --border: #2a2a2a;
    --border-hover: #444444;
    --text: #f5f5f5;
    --text-dim: #888888;
    --accent: #ffffff;
    --ok: #d4d4d4;
    --warn: #d4d4d4;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  nav {
    display: flex;
    gap: 28px;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
  }

  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  nav a:hover, nav a.active {
    color: var(--text);
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px;
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 8px 0;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 40px 0;
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
    margin-top: 20px;
  }

  label:first-child { margin-top: 0; }

  input[type="text"], input[type="file"] {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--border-hover);
  }

  input[type="file"] {
    padding: 10px;
  }

  button {
    width: 100%;
    margin-top: 28px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover { opacity: 0.88; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .result-row:last-child { border-bottom: none; }

  .result-label {
    color: var(--text-dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .result-value {
    font-size: 16px;
    font-weight: 700;
  }

  .pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border-hover);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-text {
    font-size: 14px;
    line-height: 1.6;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .status-text.verified { color: var(--ok); }
  .status-text.unverified { color: var(--warn); }

  .error-box {
    border: 1px solid var(--border-hover);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 20px;
  }

  .mono {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 12px;
    color: var(--text-dim);
    word-break: break-all;
  }

  img.qr {
    display: block;
    margin: 20px auto 0 auto;
    width: 200px;
    height: 200px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 11px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  .chain-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
<nav>
  <a href="/" class="{% block nav_index %}{% endblock %}">Detect</a>
  <a href="/register" class="{% block nav_register %}{% endblock %}">Register Original</a>
  <a href="/chain" class="{% block nav_chain %}{% endblock %}">Chain Log</a>
</nav>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
